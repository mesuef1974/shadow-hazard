[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-hazard"
version = "0.1.0"
description = "Educational prototype for early warning of occluded road hazards."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ظل الخطر project team" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
