<section class="status page-heading" aria-labelledby="page-heading-title">
  <div class="page-heading-copy">
    <p class="eyebrow">{{ eyebrow }}</p>
    <h1 id="page-heading-title">{{ title }}</h1>
    {% if description %}<p class="page-heading-description">{{ description }}</p>{% endif %}
  </div>
  {% if metric_label %}<p class="page-heading-metric"><strong>{{ metric }}</strong><span>{{ metric_label }}</span></p>{% endif %}
</section>
