<form method="get" class="usage-filters"><label for="session-filter">الجلسة</label><select id="session-filter" name="session"><option value="">كل جلسات المشروع</option>{% for choice in session_choices %}<option value="{{ choice.pk }}" {% if choice.pk == selected_session %}selected{% endif %}>{{ choice.name }}</option>{% endfor %}</select><label for="period">فترة التحليل</label><select id="period" name="period"><option value="all" {% if analytics.period == 'all' %}selected{% endif %}>كل التاريخ</option><option value="day" {% if analytics.period == 'day' %}selected{% endif %}>آخر 24 ساعة</option><option value="week" {% if analytics.period == 'week' %}selected{% endif %}>آخر 7 أيام</option></select><button>تحديث التحليل</button></form>
