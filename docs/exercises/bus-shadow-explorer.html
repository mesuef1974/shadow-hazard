<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نموذج ظل الحافلة</title></head><body style="margin:8px">
<style>
.bz{--tx:var(--text-primary,#1f1e1d);--t2:var(--text-secondary,#5f5e5a);--ln:var(--border-strong,#b4b2a9);--cd:var(--surface-1,#f1efe8);font-family:var(--font-sans,system-ui,sans-serif);color:var(--tx);direction:rtl;font-size:14px;line-height:1.6}
.bz .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bz .sc{display:flex;gap:6px;align-items:stretch;justify-content:center;margin-bottom:6px}
.bz svg{display:block;flex:none;block-size:calc(100vh - 66px);min-block-size:420px;max-block-size:760px;touch-action:none;direction:ltr;border:.5px solid var(--ln);border-radius:8px}
.bz #near{aspect-ratio:240/680}.bz #far{aspect-ratio:44/680}
.bz svg text{fill:var(--tx);font-size:13px}
.bz svg text.on-road{fill:#fff;font-weight:600}
.bz .bar{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.bz .bar button,.bz .bar select{height:34px;flex:none;width:auto;font-size:14px}
.bz #state{flex:1 1 auto;min-width:0;min-height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;background:var(--cd)}
.bz #state b{font-weight:500}
.bz #state span{color:var(--t2)}
.bz #state[data-tone=d]{background:var(--bg-danger,#fcebeb)}
.bz #state[data-tone=d] b{color:var(--text-danger,#a32d2d)}
.bz #state[data-tone=w]{background:var(--bg-warning,#faeeda)}
.bz #state[data-tone=w] b{color:var(--text-warning,#854f0b)}
.bz .st{display:grid;grid-auto-rows:1fr;gap:6px;flex:1 1 0;min-inline-size:96px;max-inline-size:170px}
.bz .st div{background:var(--cd);border-radius:8px;padding:2px 8px;line-height:1.4;display:flex;flex-direction:column;justify-content:center}
.bz .st small{display:block;color:var(--t2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bz .st b{font-weight:500}
.bz .gr{columns:2;column-gap:8px}
.bz fieldset{break-inside:avoid;border:.5px solid var(--ln);border-radius:8px;padding:0 8px 1px;margin:0 0 4px}
.bz legend{font-weight:500;padding:0 4px;line-height:1.3}
.bz label{display:flex;align-items:center;gap:6px;min-height:24px;color:var(--t2);line-height:1.2}
.bz label.r{display:grid;grid-template-columns:minmax(0,1fr) 62px 56px}
.bz label input[type=range]{width:100%;margin:0;min-width:0}
.bz label input[type=checkbox]{width:18px;height:18px;margin:3px}
.bz label output{color:var(--tx);white-space:nowrap}
.bz :focus-visible{outline:2px solid currentColor;outline-offset:2px}
.bz{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:10px;align-items:start}
@media(max-width:899px){.bz{grid-template-columns:270px minmax(0,1fr)}.bz .bar{flex-wrap:wrap}.bz #state{flex-basis:100%}.bz .sc{flex-wrap:wrap}.bz svg{block-size:calc(100vh - 262px)}.bz .st{flex:1 1 100%;max-inline-size:none;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto}}
@media(max-width:620px){.bz{grid-template-columns:minmax(0,1fr)}.bz svg{block-size:70vh}}
</style>
<div class="bz" id="bz" lang="ar">
<div>
<h2 class="sr">نموذج تفاعلي للحافلة والكاميرتين والظل والتحذير</h2>

const ROADW=7.3,WALK0=.3,WALK1=3.3,BUSMIRROR=.066,CARSPRITEW=2.1;
const rad=d=>d*Math.PI/180;
function rect(p){return{x0:-p.busL,x1:0,y0:p.curb,y1:p.curb+p.busW}}
function hit(a,b,r){let t0=0,t1=1;const dx=b.x-a.x,dy=b.y-a.y;
for(const [q,w] of [[-dx,a.x-r.x0],[dx,r.x1-a.x],[-dy,a.y-r.y0],[dy,r.y1-a.y]]){
if(q===0){if(w<0)return false}else{const t=w/q;if(q<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}}
return t0<t1}
function camA(p){return{x:-p.busL+p.aPos*p.busL,y:p.curb+p.busW+p.aArm}}
function camB(p){return{x:.05,y:p.curb+p.bPos*p.busW}}
function off(c,t,head){let d=Math.atan2(t.y-c.y,t.x-c.x)*180/Math.PI-head;d=((d+540)%360)-180;return Math.abs(d)}
function pix(p,r){return PXW/Math.tan(rad(p.aFov/2))*CARW/Math.max(r,.1)}
function seeCar(p,s){const c=camA(p),t={x:s.carX,y:p.lane},r=Math.hypot(t.x-c.x,t.y-c.y);
const px=pix(p,r);return{px,ok:p.aOn&&off(c,t,p.aHead)<=p.aFov/2&&!hit(c,t,rect(p))&&px>=p.aPx}}
function seeChild(p,s){const c=camB(p),t={x:s.chX,y:s.chY},d=Math.hypot(t.x-c.x,t.y-c.y);
const vf=2*Math.atan(Math.tan(rad(p.bFov/2))*9/16)*180/Math.PI,head=Math.atan2(p.bH-1.1,d)*180/Math.PI;
return p.bOn&&off(c,t,p.bHead)<=p.bFov/2&&!hit(c,t,rect(p))&&head<=p.bTilt+vf/2&&head>=p.bTilt-vf/2}
function eye(p,s){return{x:s.carX-1.8,y:p.lane+.4}}
function fresh(p){return{t:0,carX:-p.d0,vel:p.v/3.6,chX:p.cx,chY:p.curb,tBrake:Infinity,tWarn:null,tHold:null,done:false,res:'',gap:Infinity,warnT:0,state:'',hidden:true,px:0}}
function assess(p,s){const e=eye(p,s),h=hit(e,{x:s.chX,y:s.chY},rect(p));s.hidden=h;const car=seeCar(p,s);s.px=car.px;
if(!p.sys)return'off';if(!p.aOn||!p.bOn)return'na';const ch=seeChild(p,s);
const near=s.vel>0&&e.x<s.chX&&(s.chX-s.carX)/s.vel<=p.hz;
if(!ch)return'nochild';if(!car.ok&&s.tWarn===null)return near?'nocar':'clear';return h&&near?'warn':'clear'}
function step(p,s,dt){if(s.done)return;s.t+=dt;s.state=assess(p,s);const on=s.state==='warn';
if(on){s.warnT+=dt;if(s.tWarn===null)s.tWarn=s.t;if((p.panel||p.arm)&&p.dObey)s.tBrake=Math.min(s.tBrake,s.t+p.rt);if(s.tHold===null&&p.light&&p.cObey)s.tHold=s.t+p.crt}else s.tHold=null;
const passed=s.carX-CARL>s.chX+R;
if(!s.hidden&&!passed)s.tBrake=Math.min(s.tBrake,s.t+p.rt);
if(s.t>=s.tBrake)s.vel=Math.max(0,s.vel-p.dec*dt);
s.carX+=s.vel*dt;
const committed=s.chY+R>p.lane-CARW/2-.2,held=s.tHold!==null&&s.t>=s.tHold&&!committed;
if(!held)s.chY+=p.cv*dt;
const inBand=s.chY+R>p.lane-CARW/2&&s.chY-R<p.lane+CARW/2;
if(inBand){const g=s.chX-R-s.carX;if(g>=0)s.gap=Math.min(s.gap,g);
if(s.carX>=s.chX-R&&s.carX-CARL<=s.chX+R){s.done=true;s.res='اصطدام بسرعة '+Math.round(s.vel*3.6)+' كم/س';return}}
if(s.vel===0&&s.carX>s.chX-R&&!inBand){s.done=true;s.res='وقف الطفل، وتوقفت السيارة عند موضعه أو بعده';return}
if(s.chY>p.lane+CARW/2+1||s.t>30){s.done=true;
s.res=s.vel===0?'توقفت السيارة قبل الطفل بـ'+Math.max(0,s.chX-R-s.carX).toFixed(1)+' م':passed?'مرّت السيارة قبل وصول الطفل':'عبر الطفل قبل السيارة بـ'+(isFinite(s.gap)?s.gap.toFixed(0):'؟')+' م'}}
function run(over){const p=Object.assign({},DEF,over),s=fresh(p);for(let i=0;i<4000&&!s.done;i++)step(p,s,.01);return{res:s.res,tWarn:s.tWarn,state:s.state,hit:s.res.startsWith('اصطدام')}}
window.__bz={run,DEF,PRE};
if(!document.getElementById('bz'))return;
let P=Object.assign({},DEF),S=fresh(P),playing=false,last=0,timer=0;S.state=assess(P,S);
const $=id=>document.getElementById(id),inputs={};
function fmt(k,v,u){const n=Number.isInteger(+v)?v:(+v).toFixed(k==='aPos'||k==='bPos'||k==='aArm'?2:1);return u==='°'?n+'°':n+(u?' '+u:'')}
function syncInputs(){for(const k in inputs){const [el,o,u]=inputs[k];if(el.type==='checkbox')el.checked=P[k];else{el.value=P[k];o.textContent=fmt(k,P[k],u);el.setAttribute('aria-valuetext',o.textContent)}}}
function reset(){S=fresh(P);S.state=assess(P,S);playing=false;$('play').textContent='تشغيل';draw()}
for(const [title,items] of SPEC){const f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent=title;f.append(l);
for(const [k,name,min,max,st,u] of items){const lb=document.createElement('label'),sp=document.createElement('span'),i=document.createElement('input');sp.textContent=name;i.setAttribute('aria-label',title+': '+name);
if(min===undefined){i.type='checkbox';lb.append(i,sp);i.onchange=()=>{P[k]=i.checked;reset()};inputs[k]=[i]}
else{const o=document.createElement('output');lb.className='r';i.type='range';i.min=min;i.max=max;i.step=st;if(LTR.has(k))i.dir='ltr';lb.append(sp,i,o);i.oninput=()=>{P[k]=+i.value;o.textContent=fmt(k,P[k],u);i.setAttribute('aria-valuetext',o.textContent);reset()};inputs[k]=[i,o,u]}
f.append(lb)}$('ctl').append(f)}
for(const n in PRE){const o=document.createElement('option');o.textContent=n;$('presets').append(o)}
$('presets').onchange=e=>{P=Object.assign({},DEF,PRE[e.target.value]);syncInputs();reset()};
$('play').onclick=()=>{if(S.done)reset();playing=!playing;$('play').textContent=playing?'إيقاف':'تشغيل';last=performance.now();clearInterval(timer);if(playing)timer=setInterval(loop,33)};
$('reset').onclick=reset;
function loop(){const n=performance.now();if(!playing){clearInterval(timer);return}const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;for(let i=0;i<5;i++)step(P,S,dt/5);if(S.done){playing=false;$('play').textContent='تشغيل'}draw()}
function view(x0,x1,y0,h){const k=680/(x1-x0);return{k,x0,h,X:x=>(x-x0)*k,Y:y=>h-(y-y0)*k}}
function wedge(v,c,head,fov,len,col){const a=rad(head-fov/2),b=rad(head+fov/2),n=[];for(let i=0;i<=12;i++){const t=a+(b-a)*i/12;n.push(v.X(c.x+len*Math.cos(t))+','+v.Y(c.y+len*Math.sin(t)))}
return`<polygon points="${v.X(c.x)},${v.Y(c.y)} ${n.join(' ')}" fill="${col}" opacity=".24"/>`}
function shadow(v,e,r){const cs=[[r.x0,r.y0],[r.x0,r.y1],[r.x1,r.y0],[r.x1,r.y1]].map(([x,y])=>({x,y,a:Math.atan2(y-e.y,x-e.x)}));cs.sort((m,n)=>m.a-n.a);
const lo=cs[0],hi=cs[3],far=c=>({x:e.x+(c.x-e.x)*40,y:e.y+(c.y-e.y)*40}),pts=[lo,far(lo),far(hi),hi].map(c=>v.X(c.x)+','+v.Y(c.y)).join(' ');
return`<polygon points="${pts}" fill="#E24B4A" opacity=".34"/><line x1="${v.X(e.x)}" y1="${v.Y(e.y)}" x2="${v.X(far(hi).x)}" y2="${v.Y(far(hi).y)}" stroke="#A32D2D" stroke-dasharray="5 4"/><line x1="${v.X(e.x)}" y1="${v.Y(e.y)}" x2="${v.X(far(lo).x)}" y2="${v.Y(far(lo).y)}" stroke="#A32D2D" stroke-dasharray="5 4"/>`}
// x1 مقدمة المجسم وy1 حافته اليسرى؛ يعكس المصفوفة دوران المشهد فتبقى المقدمة إلى أعلى.
function sprite(v,id,x1,y1,len,wid){return`<use href="#${id}" transform="matrix(0 ${wid*v.k} ${-len*v.k} 0 ${v.X(x1)} ${v.Y(y1)})"/>`}
function crosswalk(v){let o='';for(let y=.25;y<ROADW-.3;y+=1)o+=`<rect x="${v.X(WALK0)}" y="${v.Y(y+.5)}" width="${(WALK1-WALK0)*v.k}" height="${.5*v.k}" fill="#fff"/>`;return o}
function scene(v,full){const r=rect(P),e=eye(P,S),a=camA(P),b=camB(P),on=S.state==='warn',lit=c=>on&&c?'#E24B4A':'#888780',W=v.k;
let o=`<rect width="680" height="${v.h}" fill="#C8D3DB"/><rect y="${v.Y(ROADW)}" width="680" height="${ROADW*W}" fill="#414B57"/><line x1="0" x2="680" y1="${v.Y(0)}" y2="${v.Y(0)}" stroke="#fff" stroke-width="2"/><line x1="0" x2="680" y1="${v.Y(3.65)}" y2="${v.Y(3.65)}" stroke="#fff" stroke-dasharray="10 8"/><line x1="0" x2="680" y1="${v.Y(ROADW)}" y2="${v.Y(ROADW)}" stroke="#fff" stroke-width="2"/>`;
o+=crosswalk(v);
o+=shadow(v,e,r);
if(P.aOn)o+=wedge(v,a,P.aHead,P.aFov,PXW/Math.tan(rad(P.aFov/2))*CARW/P.aPx,'#378ADD');
if(P.bOn)o+=wedge(v,b,P.bHead,P.bFov,12,'#378ADD');
const mirror=BUSMIRROR*P.busW;o+=sprite(v,'bzBus',r.x1,r.y1+mirror,P.busL,P.busW+2*mirror);
if(P.panel)o+=`<rect x="${v.X(r.x0)-Math.max(3,.25*W)}" y="${v.Y(r.y1-.3)}" width="${Math.max(3,.25*W)}" height="${(P.busW-.6)*W}" fill="${lit(1)}"/>`;
if(P.arm)o+=`<rect x="${v.X(-2.5)}" y="${v.Y(r.y1+1.7)}" width="${Math.max(2,.22*W)}" height="${1.7*W}" fill="${lit(1)}"/>`;
if(P.light)o+=`<circle cx="${v.X(-.15)}" cy="${v.Y(r.y1-.15)}" r="${Math.max(2,.2*W)}" fill="${lit(1)}"/>`;
o+=sprite(v,'bzCar',S.carX,P.lane+CARSPRITEW/2,CARL,CARSPRITEW)+`<circle cx="${v.X(e.x)}" cy="${v.Y(e.y)}" r="${Math.max(2,.15*W)}" fill="#F1EFE8"/>`;
o+=`<circle cx="${v.X(a.x)}" cy="${v.Y(a.y)}" r="${Math.max(3,.28*W)}" fill="${P.aOn?'#185FA5':'#888780'}"/><circle cx="${v.X(b.x)}" cy="${v.Y(b.y)}" r="${Math.max(3,.28*W)}" fill="${P.bOn?'#185FA5':'#888780'}"/>`;
o+=`<circle cx="${v.X(S.chX)}" cy="${v.Y(S.chY)}" r="${Math.max(3,R*W)}" fill="#A32D2D"/>`;
// المشهد يُحسب بإحداثيات الطريق ثم يدور: السيارة تصعد والحافلة على يمينها.
o=`<g transform="matrix(0 -1 1 0 0 680)">${o}</g>`;
if(full)o+=`<text x="${v.Y(P.curb+P.busW/2)}" y="${680-v.X(-P.busL/2)+5}" text-anchor="middle">الحافلة</text><text class="on-road" x="${v.Y(ROADW/2)}" y="${680-v.X(WALK1)-8}" text-anchor="middle">ممر المشاة</text>`;
return o}
const VF=view(-130,20,-.5,44),VN=view(-14,9,-.5,240);
const NAMES={warn:'تحذير: طفل في الظل',clear:'لا تحذير',na:'غير متاح',off:'النظام مطفأ',nochild:'الطفل خارج الرؤية',nocar:'السيارة غير مرصودة'};
const TONE={warn:'d',na:'w',nochild:'w',nocar:'w'};
function put(id,t){const e=$(id);if(e.textContent!==t)e.textContent=t}
function draw(){$('far').innerHTML=scene(VF,false);$('near').innerHTML=scene(VN,true);
const v=P.v/3.6,stop=v*P.rt+v*v/(2*P.dec),path=(P.lane-CARW/2-P.curb)/P.cv;
put('stName',NAMES[S.state]||'-');put('stRes',S.res);$('state').dataset.tone=S.res.startsWith('اصطدام')?'d':TONE[S.state]||'';
const c=[['الزمن',S.t.toFixed(1)+' ث'],['مسافة التوقف',stop.toFixed(0)+' م'],['وصول الطفل',path.toFixed(1)+' ث'],['عرض السيارة',Math.round(S.px)+' بكسل'],['أول تحذير',S.tWarn===null?'لم يصدر':S.tWarn.toFixed(1)+' ث']];
$('stats').innerHTML=c.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}
let drag=null;
function pt(ev,sv,v){const q=sv.getBoundingClientRect(),Y=(ev.clientX-q.left)/q.width*sv.viewBox.baseVal.width,X=680-(ev.clientY-q.top)/q.height*680;return{x:X/v.k+v.x0,y:(v.Y(0)-Y)/v.k}}
function bind(sv,v,tol){sv.onpointerdown=ev=>{const m=pt(ev,sv,v),a=camA(P),b=camB(P),o=[['child',S.chX,S.chY],['a',a.x,a.y],['b',b.x,b.y],['car',S.carX-2,P.lane]].map(([n,x,y])=>[Math.hypot(x-m.x,y-m.y),n]).sort((p,q)=>p[0]-q[0])[0];
if(o[0]<tol){drag=[o[1],sv,v];sv.setPointerCapture(ev.pointerId)}};
sv.onpointermove=ev=>{if(!drag||drag[1]!==sv)return;const m=pt(ev,sv,v),cl=(n,a,b)=>Math.min(b,Math.max(a,n));
if(drag[0]==='child')P.cx=+cl(m.x,.3,8).toFixed(1);if(drag[0]==='a')P.aPos=+cl((m.x+P.busL)/P.busL,0,1).toFixed(2);if(drag[0]==='b')P.bPos=+cl((m.y-P.curb)/P.busW,0,1).toFixed(2);if(drag[0]==='car')P.d0=Math.round(cl(-(m.x+2),10,125));syncInputs();reset()};
sv.onpointerup=()=>{drag=null}}
bind($('near'),VN,1.5);bind($('far'),VF,6);syncInputs();draw()})();
</script>
