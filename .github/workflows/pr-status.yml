name: PR status

# حالة الطلبات المفتوحة تُكتب وحدها كل يوم عمل وعند تغيّر الطلبات، فلا يُكتشف التعارض أو انتظار المراجع يدويًا.
on:
  schedule:
    - cron: '0 5 * * 0-4'   # 08:00 بتوقيت الدوحة، الأحد–الخميس
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  status:
    name: PR status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # نسحب الفرع الافتراضي دائمًا (لا كود الطلب) لأن pull_request_target يملك أذونات القراءة.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Close superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/pr_close_superseded.py "${{ github.repository }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python scripts/pr_status.py "${{ github.repository }}" | tee -a "$GITHUB_STEP_SUMMARY"
