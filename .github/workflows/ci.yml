name: CI

# لا pull_request: الطلب الذي يفتحه بوت Actions يعلّق تشغيله بانتظار موافقة ثم يسقط أحمر عند الدمج.
# فحوص الدفع على الإيداع نفسه تكفي الحماية، وفروع Dependabot تُفحص بالدفع مثل غيرها (ADR 0005).
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'chore/**', 'dependabot/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/ci/check_repository.py
      - run: git diff --check

  backend:
    name: Backend / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: shadow_hazard_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d shadow_hazard_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://ci:ci-ephemeral-only@localhost:5432/shadow_hazard_ci?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create the project virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py check --fail-level WARNING
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - name: Tests
        run: |
          set -o pipefail
          python backend/manage.py test accounts execution_context registry token_usage workspace operations releases knowledge simulation --noinput 2>&1 | tee test.log
      - name: Rerun failed tests once
        if: failure()
        run: |
          ids=$(python scripts/failure_digest.py --ids test.log)
          if [ -n "$ids" ]; then
            python backend/manage.py test $ids --noinput > rerun.log 2>&1 || true
          fi
      - name: Failure digest
        if: failure()
        run: |
          python scripts/failure_digest.py test.log "Backend / ${{ matrix.database }}" failure-digest.md rerun.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload failure digest
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-digest-${{ matrix.database }}
          path: failure-digest.md
      - run: python backend/manage.py collectstatic --noinput

  prepush:
    name: Pre-push check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history: the freeze-history check needs FREEZE_BASE
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/prepush_check.py

  report:
    name: Report browser
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/ci/requirements.txt
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tools/ci/requirements.txt') }}
      # بلا --with-deps: مكتبات Chromium في صورة المشغّل، وكان apt يعلّق على خطوط لا يحتاجها الفحص (ADR 0005).
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            timeout 180 python -m playwright install chromium && exit 0
            echo "attempt $attempt failed"
            sleep 5
          done
          exit 1
      - run: python tools/ci/check_report.py

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements.txt --strict
      - run: python -m pip_audit -r tools/ci/requirements.txt --strict

  pr-flow:
    name: PR flow
    # بعد نجاح كل الفحوص فقط، وعلى الدفع إلى فرع عمل: يفتح الطلب ويدمج ما قاعدته غير main.
    # توكن Dependabot لا يملك الدمج؛ طلباته تدمجها مهمة النشر (scripts/pr_updates.py).
    if: github.ref_name != 'main' && !startsWith(github.ref_name, 'dependabot/')
    needs: [repository, backend, prepush, report, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          python3 scripts/pr_flow.py "$REPO" "$BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close superseded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          python3 scripts/pr_close_superseded.py "$REPO" | tee -a "$GITHUB_STEP_SUMMARY"
