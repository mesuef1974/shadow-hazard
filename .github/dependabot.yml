version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-small:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /tools/ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-small:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
